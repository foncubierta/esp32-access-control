server {
    listen 80;
    server_name _;

    root /opt/esp32-access-control/frontend/dist;
    index index.html;

    # React Router — any path that isn't a real file falls back to index.html
    location / {
        try_files $uri /index.html;
    }

    # Both the browser panel and the ESP32 nodes talk to this same entry
    # point — a node's "backend URL" in the config portal is just
    # http://<ip-del-lxc> (port 80), nothing else to configure.
    location /api/ {
        proxy_pass http://127.0.0.1:8010/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
